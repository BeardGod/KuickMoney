name: AI Sports Betting Analyst

on:
  schedule:
    # 10:52 AM US Eastern (EDT) daily - after morning injury news, before the early games
    - cron: '52 14 * * *'
  workflow_dispatch:
    inputs:
      leagues:
        description: "Comma-separated leagues, or 'all'"
        default: all
      effort:
        description: "Claude effort level (low/medium/high/xhigh/max)"
        default: high

permissions:
  contents: write

concurrency:
  group: sports-analyst
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: sports-analyst
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sports-analyst/requirements.txt

      - run: pip install -r requirements.txt

      - name: Grade yesterday's picks and build today's card
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m kuick_analyst run --leagues "${{ github.event.inputs.leagues || 'all' }}" --effort "${{ github.event.inputs.effort || 'high' }}"

      - name: Commit reports and ledger
        run: |
          git config user.name "kuickmoney-analyst"
          git config user.email "actions@users.noreply.github.com"
          git add reports data
          git diff --cached --quiet || git commit -m "Daily betting card $(date -u +%F)"
          git push
